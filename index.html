<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal monitoring engine</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node text {
            font: 12px sans-serif;
            fill: #333;
            text-anchor: middle;
        }

        .link {
            fill: none;
            stroke: #999;
            stroke-width: 2px;
        }
    </style>
</head>

<body>
    <h1>Goal monitoring engine</h1>
    <form action="http://localhost:8082/api/getResultsAsFile">
        <input type="submit" value="Download ADOxx model" />
    </form>
    <svg width="960" height="600"></svg>
    <div id="jsonContainer" style="white-space: pre-wrap;"></div>

    <script>
        const apiUrl = "http://localhost:8082/api/getStatus";
        const nodeSize = { width: 140, height: 50 };
        const positionScale = 40;

        function parsePosition(positionText) {
            const match = positionText?.match(/NODE\s+x:(-?\d+(?:\.\d+)?)cm\s+y:(-?\d+(?:\.\d+)?)cm/i);
            if (!match) {
                return null;
            }

            return {
                x: parseFloat(match[1]) * positionScale,
                y: parseFloat(match[2]) * positionScale
            };
        }

        function normalizeFulfillment(value) {
            const normalized = (value || "").toLowerCase();
            if (normalized === "satisfied") {
                return "satisfied";
            }
            if (normalized === "denied") {
                return "denied";
            }
            return "unknown";
        }

        function getNodeColor(fulfillment) {
            if (fulfillment === "satisfied") {
                return "#20FF00";
            }
            if (fulfillment === "denied") {
                return "#FF2000";
            }
            return "#FFCC00";
        }

        function renderModel(modelData) {
            const canvas = modelData?.canvas || { width: 960, height: 600 };
            const width = canvas.width;
            const height = canvas.height;

            const svg = d3.select("svg");
            svg.selectAll("*").remove();
            svg.attr("width", width)
                .attr("height", height)
                .attr("viewBox", `0 0 ${width} ${height}`);

            const group = svg.append("g");
            const defs = group.append("defs");
            defs.append("marker")
                .attr("id", "arrow")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 8)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", "#999");

            const instances = Array.isArray(modelData?.instances) ? modelData.instances : [];
            const nodes = new Map();

            instances.forEach((instance) => {
                const name = instance.name;
                if (!name) {
                    return;
                }

                const position = parsePosition(instance.position);
                nodes.set(name, {
                    name,
                    kind: instance.class,
                    fulfillment: normalizeFulfillment(instance.fulfillment),
                    position: position || { x: 100, y: 100 }
                });
            });

            const links = Array.isArray(modelData?.connectors) ? modelData.connectors : [];
            const childCountByNode = new Map([...nodes.keys()].map((name) => [name, 0]));
            links.forEach((link) => {
                const currentCount = childCountByNode.get(link.to) || 0;
                childCountByNode.set(link.to, currentCount + 1);
            });

            const decompositionByNode = new Map();
            links.forEach((link) => {
                if (!decompositionByNode.has(link.to) && link.type === "Decomposition Link") {
                    decompositionByNode.set(link.to, link.decomposition || "unknown");
                }
            });

            group.append("g")
                .selectAll("path")
                .data(links)
                .join("path")
                .attr("class", "link")
                .attr("d", (link) => {
                    const source = nodes.get(link.from)?.position;
                    const target = nodes.get(link.to)?.position;
                    if (!source || !target) {
                        return "";
                    }
                    return `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
                })
                .attr("marker-end", "url(#arrow)");

            const nodeGroups = group.append("g")
                .selectAll("g.node")
                .data([...nodes.values()].map((node) => ({
                    ...node,
                    children: childCountByNode.get(node.name) || 0,
                    decomposition: decompositionByNode.get(node.name) || "unknown"
                })))
                .join("g")
                .attr("class", "node")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            nodeGroups.filter((node) => node.children > 0)
                .append("rect")
                .attr("x", -nodeSize.width / 2)
                .attr("y", -nodeSize.height / 2)
                .attr("width", nodeSize.width)
                .attr("height", nodeSize.height)
                .attr("rx", 10)
                .attr("ry", 10)
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            nodeGroups.filter((node) => node.children === 0)
                .append("path")
                .attr("d", (node) => {
                    const textLength = node.name.length * 7;
                    const size = Math.max(textLength / 2, 40);
                    const height = 30;
                    const points = [
                        [-size + 7, -height],
                        [-size, 0],
                        [-size + 7, height],
                        [size - 7, height],
                        [size, 0],
                        [size - 7, -height]
                    ].map((point) => point.join(",")).join(" ");

                    return `M${points}Z`;
                })
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            nodeGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            nodeGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 15)
                .text((node) => `(${node.fulfillment})`);

            nodeGroups.filter((node) => node.children > 0)
                .append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 30)
                .text((node) => node.decomposition);

            document.getElementById("jsonContainer").textContent = `Rendered ${nodes.size} nodes from ${apiUrl}`;
        }

        async function fetchAndDisplayJson() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`${response.status} ${response.statusText}`);
                }

                const jsonData = await response.json();
                renderModel(jsonData);
            } catch (error) {
                document.getElementById("jsonContainer").textContent = `Failed to fetch JSON: ${error.message}`;
            }
        }

        setInterval(fetchAndDisplayJson, 5000);
        fetchAndDisplayJson();
    </script>
</body>

</html>
