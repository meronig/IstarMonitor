<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal monitoring engine</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node text {
            font: 12px sans-serif;
            fill: #333;
            text-anchor: middle;
        }

        .link {
            fill: none;
            stroke: #333;
            stroke-width: 2px;
        }
    </style>
</head>

<body>
    <h1>Goal monitoring engine</h1>
    <form action="http://localhost:8082/api/getResultsAsFile">
        <input type="submit" value="Download ADOxx model" />
    </form>
    <svg width="960" height="600"></svg>
    <div id="jsonContainer" style="white-space: pre-wrap;"></div>

    <script>
        const apiUrl = "http://localhost:8082/api/getStatus";
        const nodeSize = { width: 140, height: 50 };
        const positionScale = 40;

        function parsePosition(positionText) {
            const match = positionText?.match(/NODE\s+x:(-?\d+(?:\.\d+)?)cm\s+y:(-?\d+(?:\.\d+)?)cm/i);
            if (!match) {
                return null;
            }

            return {
                x: parseFloat(match[1]) * positionScale,
                y: parseFloat(match[2]) * positionScale
            };
        }

        function parseSizeAndPosition(positionText) {
            const match = positionText?.match(/NODE\s+x:(-?\d+(?:\.\d+)?)cm\s+y:(-?\d+(?:\.\d+)?)cm\s+w:(-?\d+(?:\.\d+)?)cm\s+h:(-?\d+(?:\.\d+)?)cm/i);
            if (!match) {
                return null;
            }

            return {
                x: parseFloat(match[1]) * positionScale,
                y: parseFloat(match[2]) * positionScale,
                w: parseFloat(match[3]) * positionScale,
                h: parseFloat(match[4]) * positionScale
            };
        }

        function normalizeFulfillment(value) {
            const normalized = (value || "").toLowerCase();
            if (normalized === "satisfied") {
                return "satisfied";
            }
            if (normalized === "denied") {
                return "denied";
            }
            return "unknown";
        }

        function getNodeColor(fulfillment) {
            if (fulfillment === "satisfied") {
                return "#20FF00";
            }
            if (fulfillment === "denied") {
                return "#FF2000";
            }
            return "#FFCC00";
        }

        function renderModel(modelData) {
            const canvas = modelData?.canvas || { width: 960, height: 600 };
            const width = canvas.width;
            const height = canvas.height;

            const svg = d3.select("svg");
            svg.selectAll("*").remove();
            svg.attr("width", width)
                .attr("height", height)
                .attr("viewBox", `0 0 ${width} ${height}`);

            const group = svg.append("g");
            const defs = group.append("defs");
            defs.append("marker")
                .attr("id", "arrow")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 8)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", "#999");

            const instances = Array.isArray(modelData?.instances) ? modelData.instances : [];
            const nodes = new Map();

            instances.forEach((instance) => {
                const name = instance.name;
                if (!name) {
                    return;
                }

                const kind = instance.class;

                if (["Goal", "Resource", "Softgoal", "Task"].includes(kind)) {
                    const position = parsePosition(instance.position);
                    nodes.set(name, {
                        name,
                        kind: instance.class,
                        fulfillment: normalizeFulfillment(instance.fulfillment),
                        position: position || { x: 100, y: 100 }
                    });
                } else {
                    const sizeAndPosition = parseSizeAndPosition(instance.position);
                    nodes.set(name, {
                        name,
                        kind: instance.class,
                        fulfillment: normalizeFulfillment(instance.fulfillment),
                        position: sizeAndPosition || { x: 100, y: 100, w: 100, h: 50 }
                    });
                }
            });

            const links = Array.isArray(modelData?.connectors) ? modelData.connectors : [];
            
            // Create separate layers in the requested back-to-front order:
            // Boundary, Agent, Links, Goals, Tasks, Resources, Softgoals

            const allNodes = [...nodes.values()];

            // Boundary layer
            const boundaryGroups = group.append("g").attr("class", "layer boundary-layer")
                .selectAll("g.node.boundary")
                .data(allNodes.filter(n => n.kind === "Boundary"))
                .join("g")
                .attr("class", "node boundary")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            boundaryGroups.append("ellipse")
                .attr("cx", 0)
                .attr("cy", 0)
                .attr("rx", (node) => node.position.w / 2)
                .attr("ry", (node) => node.position.h / 2)
                .attr("fill", "#F0F0F0");

            // Actor layer
            const actorGroups = group.append("g").attr("class", "layer actor-layer")
                .selectAll("g.node.actor")
                .data(allNodes.filter(n => n.kind === "Actor" || n.kind === "Agent" || n.kind === "Role"))
                .join("g")
                .attr("class", "node actor")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            actorGroups.append("circle")
                .attr("cx", 0)
                .attr("cy", 0)
                .attr("r", nodeSize.height)
                .attr("fill", "#909090");

            actorGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            // Contribution link layer
            const contributionLinkGroups = group.append("g")
                .attr("class", "layer links-layer")
                .selectAll("g.link.contribution")
                .data(links.filter(link => link.type === "Contribution Link"))
                .join("g")
                .attr("class", "link contribution");

            contributionLinkGroups.append("path")
                .attr("id", (link, i) => `contribution-link-${i}`)
                .attr("d", (link) => {
                    const source = nodes.get(link.from)?.position;
                    const target = nodes.get(link.to)?.position;

                    if (!source || !target) {
                        return "";
                    }

                    return `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
                });
                
            //  .attr("marker-end", "url(#arrow)");

            contributionLinkGroups.append("text")
                .append("textPath")
                .attr("href", (link, i) => `#contribution-link-${i}`)
                .attr("startOffset", "50%")
                .attr("text-anchor", "middle")
                .attr("stroke", "none")
                .attr("fill", "black")
                .text((link) => `(${link.contribution || "unknown"})`);

            // Decomposition link layer
            const decompositionLinkGroups = group.append("g")
                .attr("class", "layer links-layer")
                .selectAll("g.link.decomposition")
                .data(links.filter(link => link.type === "Decomposition Link"))
                .join("g")
                .attr("class", "link decomposition")
                
            decompositionLinkGroups.append("path")
                .attr("id", (link, i) => `decomposition-link-${i}`)
                .attr("d", (link) => {
                    const source = nodes.get(link.from)?.position;
                    const target = nodes.get(link.to)?.position;

                    console.log(link);

                    if (!source || !target) {
                        return "";
                    }

                    return `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
                });
            //  .attr("marker-end", "url(#arrow)");

            decompositionLinkGroups.append("text")
                .append("textPath")
                .attr("href", (link, i) => `#decomposition-link-${i}`)
                .attr("startOffset", "50%")
                .attr("text-anchor", "middle")
                .attr("stroke", "none")
                .attr("fill", "black")
                .text((link) => `(${link.decomposition || "unknown"})`);

            // Dependency link layer
            const dependencyLinkGroups = group.append("g")
                .attr("class", "layer links-layer")
                .selectAll("g.link.dependency")
                .data(links.filter(link => link.type === "Dependency Link"))
                .join("g")
                .attr("class", "link dependency")
                
            dependencyLinkGroups.append("path")
                .attr("id", (link, i) => `dependency-link-${i}`)
                .attr("d", (link) => {
                    const source = nodes.get(link.from)?.position;
                    const target = nodes.get(link.to)?.position;

                    console.log(link);

                    if (!source || !target) {
                        return "";
                    }

                    return `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
                });
            //  .attr("marker-end", "url(#arrow)");

            dependencyLinkGroups.append("text")
                .append("textPath")
                .attr("href", (link, i) => `#dependency-link-${i}`)
                .attr("startOffset", "50%")
                .attr("text-anchor", "middle")
                .attr("stroke", "none")
                .attr("fill", "black")
                .text("D");

            // Goal layer
            const goalGroups = group.append("g").attr("class", "layer goal-layer")
                .selectAll("g.node.goal")
                .data(allNodes.filter(n => n.kind === "Goal"))
                .join("g")
                .attr("class", "node goal")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            goalGroups.append("rect")
                .attr("x", -nodeSize.width / 2)
                .attr("y", -nodeSize.height / 2)
                .attr("width", nodeSize.width)
                .attr("height", nodeSize.height)
                .attr("rx", 10)
                .attr("ry", 10)
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            goalGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            goalGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 15)
                .text((node) => `(${node.fulfillment})`);

            // Task layer
            const taskGroups = group.append("g").attr("class", "layer task-layer")
                .selectAll("g.node.task")
                .data(allNodes.filter(n => n.kind === "Task"))
                .join("g")
                .attr("class", "node task")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            taskGroups.append("path")
                .attr("d", (node) => {
                    const textLength = node.name.length * 7;
                    const size = Math.max(textLength / 2, 40);
                    const height = 30;
                    const points = [
                        [-size + 7, -height],
                        [-size, 0],
                        [-size + 7, height],
                        [size - 7, height],
                        [size, 0],
                        [size - 7, -height]
                    ].map((point) => point.join(",")).join(" ");

                    return `M${points}Z`;
                })
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            taskGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            taskGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 15)
                .text((node) => `(${node.fulfillment})`);

            // Resource layer
            const resourceGroups = group.append("g").attr("class", "layer resource-layer")
                .selectAll("g.node.resource")
                .data(allNodes.filter(n => n.kind === "Resource"))
                .join("g")
                .attr("class", "node resource")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            resourceGroups.append("rect")
                .attr("x", -nodeSize.width / 2)
                .attr("y", -nodeSize.height / 2)
                .attr("width", nodeSize.width)
                .attr("height", nodeSize.height)
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            resourceGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            resourceGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 15)
                .text((node) => `(${node.fulfillment})`);

            // Softgoal layer (frontmost)
            const softgoalGroups = group.append("g").attr("class", "layer softgoal-layer")
                .selectAll("g.node.softgoal")
                .data(allNodes.filter(n => n.kind === "Softgoal"))
                .join("g")
                .attr("class", "node softgoal")
                .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

            softgoalGroups.append("rect")
                .attr("x", -nodeSize.width / 2)
                .attr("y", -nodeSize.height / 2)
                .attr("width", nodeSize.width)
                .attr("height", nodeSize.height)
                .attr("rx", 30)
                .attr("ry", 30)
                .attr("fill", (node) => getNodeColor(node.fulfillment));

            softgoalGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", -5)
                .text((node) => node.name);

            softgoalGroups.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 15)
                .text((node) => `(${node.fulfillment})`);

            // Optional: decomposition text for nodes that have children
            const decompositionNodes = allNodes.filter(n => n.children > 0);
            if (decompositionNodes.length > 0) {
                const decompGroups = group.append("g").attr("class", "layer decomposition-layer")
                    .selectAll("g.node.decomp")
                    .data(decompositionNodes)
                    .join("g")
                    .attr("class", "node decomp")
                    .attr("transform", (node) => `translate(${node.position.x}, ${node.position.y})`);

                decompGroups.append("text")
                    .attr("text-anchor", "middle")
                    .attr("dy", 30)
                    .text((node) => node.decomposition);
            }

            document.getElementById("jsonContainer").textContent = `Rendered ${nodes.size} nodes from ${apiUrl}`;
        }

        async function fetchAndDisplayJson() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`${response.status} ${response.statusText}`);
                }

                const jsonData = await response.json();
                renderModel(jsonData);
            } catch (error) {
                document.getElementById("jsonContainer").textContent = `Failed to fetch JSON: ${error.message}`;
            }
        }

        setInterval(fetchAndDisplayJson, 5000);
        fetchAndDisplayJson();
    </script>
</body>

</html>
